services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ngan.dict
      POSTGRES_USER: ngan.dict
      POSTGRES_PASSWORD: Ngan.DictDb2026!
    volumes:
      - ngan.dict-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ngan.dict-redis-data:/data

  web:
    image: ngan.dict-server:aot-slim
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "2341:2341"
    volumes:
      - ../config/Ngan.Dict.Server.cloud.docker.jsonc:/app/Ngan.Dict.Server.cloud.docker.jsonc:ro
    command:
      - Ngan.Dict.Server.cloud.docker.jsonc

volumes:
  ngan.dict-postgres-data:
  ngan.dict-redis-data:
