version: '3.9'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: Tsinswreng
    volumes:
      - ngan.dict-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # 映射到宿主机 5432 端口
  redis:
    image: redis:latest
    volumes:
      - ngan.dict-redis-data:/data
    ports:
      - "6379:6379"   # 映射到宿主机 6379 端口
    #
  #
#

volumes:
  ngan.dict-postgres-data:
  ngan.dict-redis-data:


